<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Frame field</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
      }
      label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-family: inherit;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <label for="frame-field">Frame field</label>
    <textarea id="frame-field" rows="3" aria-label="Frame field"></textarea>
  </body>
</html>
