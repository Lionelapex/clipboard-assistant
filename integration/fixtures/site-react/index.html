<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Tickets — new request</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background: #0f172a;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 620px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      p.lede {
        margin: 0 0 20px;
        color: #94a3b8;
        font-size: 13px;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 22px;
      }
      h2 {
        margin: 0 0 16px;
        font-size: 16px;
      }
      label {
        display: block;
        margin: 12px 0 5px;
        font-size: 12px;
        color: #cbd5e1;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #e2e8f0;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.55;
      }
      textarea {
        resize: vertical;
      }
      .count {
        margin: 12px 0;
        font-size: 12px;
        color: #7dd3fc;
      }
      button {
        border: 1px solid #475569;
        background: #334155;
        color: #e2e8f0;
        border-radius: 6px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Acme Tickets</h1>
      <p class="lede">
        A React 18 page rendered entirely client-side. The textarea is a controlled component: typed or inserted
        text must reach React state, or the character count will not move.
      </p>
      <div id="root"></div>
    </main>

    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script src="/site-react/app.js"></script>
  </body>
</html>
