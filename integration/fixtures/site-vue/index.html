<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue 3 request form</title>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background: #eef2ff;
        color: #1e1b4b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 620px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #c7d2fe;
        border-radius: 10px;
        padding: 26px;
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .lede { margin: 0 0 20px; color: #6366f1; font-size: 13px; line-height: 1.5; }
      h2 { font-size: 16px; margin: 0 0 14px; }
      label { display: block; margin: 12px 0 5px; font-size: 12px; font-weight: 600; color: #3730a3; }
      input, textarea {
        width: 100%; box-sizing: border-box; padding: 8px 10px;
        border: 1px solid #a5b4fc; border-radius: 6px; font-family: inherit; font-size: 14px; line-height: 1.55;
      }
      textarea { resize: vertical; }
      .count { margin: 12px 0; font-size: 12px; color: #4338ca; }
      button {
        border: 0; border-radius: 6px; background: #4338ca; color: #fff;
        padding: 8px 13px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vue 3 support request</h1>
      <p class="lede">
        A real Vue 3 application using <code>v-model</code>. The character count is computed from Vue state,
        so it only updates when the extension's synthetic input event reaches Vue.
      </p>
      <div id="app"></div>
    </main>

    <script src="/vendor/vue.js"></script>
    <script src="/site-vue/app.js"></script>
  </body>
</html>
