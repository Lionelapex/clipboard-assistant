<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Table fixture</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 32px; background: #f8fafc; color: #0f172a; }
      main { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }
      section { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 18px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 0 0 6px; }
      p { margin: 0 0 10px; color: #475569; font-size: 13px; }
      #table-editor { min-height: 160px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; }
      textarea { width: 100%; box-sizing: border-box; min-height: 120px; border: 1px solid #cbd5e1; border-radius: 8px; padding: 9px 11px; font: 13px/1.6 ui-monospace, monospace; }
      #source-table table { border-collapse: collapse; }
      #source-table td { border: 1px solid #94a3b8; padding: 6px 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Table fixture</h1>
      <p>Word-style table source, an empty rich editor and a plain textarea.</p>

      <section>
        <h2>Source table</h2>
        <div id="source-table">
          <table>
            <tbody>
              <tr><td>Region</td><td>Revenue</td><td>Growth</td></tr>
              <tr><td>North</td><td>$1,200</td><td>12%</td></tr>
              <tr><td>South</td><td>$980</td><td>8%</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section>
        <h2>Empty rich editor</h2>
        <div id="table-editor" contenteditable="true" role="textbox" aria-label="Table editor"></div>
      </section>

      <section>
        <h2>Plain textarea</h2>
        <textarea id="table-plain" aria-label="Plain table field" placeholder="A table pastes here as tab-separated rows"></textarea>
      </section>
    </main>
  </body>
</html>
